<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schematic Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary-orange: #ff6b39;
            --text-primary: #e0e0e0;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #viewer-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .upload-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .button {
            display: flex;
            align-items: center;
            background: rgba(27, 26, 26, 0.8);
            border: 1px solid #3a3939;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            background: rgba(40, 38, 38, 0.9);
            border-color: var(--primary-orange);
        }

        .button-title {
            font-size: 1rem;
            font-weight: 500;
            margin-right: 12px;
        }

        .button-icon {
            color: var(--primary-orange);
            font-size: 1.2rem;
        }

        #fileInput {
            display: none;
        }

        .hidden-data {
            display: none;
        }
    </style>
</head>

<body>
    <div class="upload-container">
        <label for="fileInput" class="button">
            <span class="button-title">Load Schematic</span>
            <div class="button-icon"><i class="fas fa-folder-open"></i></div>
        </label>
        <input type="file" id="fileInput" accept=".bloxdschem">
    </div>

    <canvas id="viewer-canvas"></canvas>

    <div class="hidden-data">
        <span id="info-name"></span>
        <span id="info-size"></span>
        <span id="info-blocks"></span>
    </div>

    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "avsc": "https://esm.sh/avsc@5.7.7"
  }
}
</script>
    <script type="module" src="viewer.js"></script>
</body>

</html>
